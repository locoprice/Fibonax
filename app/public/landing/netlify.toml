# Netlify config for the marketing site — fibonax.com
# No build step: static HTML served directly.
# Base dir in Netlify dashboard: app/public/landing
# Publish dir: .

# www → apex redirect
[[redirects]]
  from   = "https://www.fibonax.com/*"
  to     = "https://fibonax.com/:splat"
  status = 301
  force  = true

# Former brand domain → fibonax.com, permanently, keeping the path
[[redirects]]
  from   = "https://sprintbrain.com/*"
  to     = "https://fibonax.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.sprintbrain.com/*"
  to     = "https://fibonax.com/:splat"
  status = 301
  force  = true

# Former docs address → docs.fibonax.com (needs docs.sprintbrain.com as a
# domain alias on this project; the manual itself is hosted by Mintlify)
[[redirects]]
  from   = "https://docs.sprintbrain.com/*"
  to     = "https://docs.fibonax.com/:splat"
  status = 301
  force  = true

# Cache static assets aggressively
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
