[build]
  base    = "app"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Former app address -> app.fibonax.com, permanently, keeping path and query.
# Must stay FIRST and forced: Netlify takes the first matching rule, and
# without force it skips paths that exist as files (/, /mobile/, /assets/*).
[[redirects]]
  from   = "https://app.sprintbrain.com/*"
  to     = "https://app.fibonax.com/:splat"
  status = 301
  force  = true

# Mobile app at /mobile/
[[redirects]]
  from   = "/mobile"
  to     = "/mobile/"
  status = 301

[[redirects]]
  from   = "/mobile/*"
  to     = "/mobile/:splat"
  status = 200

# SPA fallback for the dashboard (must be last)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
