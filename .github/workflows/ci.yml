name: Fibonax CI

on:
  push:
    branches: [develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22.18+ is required: check-memory-parity.js imports engine.ts directly
          # and relies on Node's native TypeScript type stripping, the same
          # mechanism services/mcp-memory runs on.
          node-version: 22

      - name: Version parity check
        run: node scripts/check-version.js

      - name: Snippet engine check
        run: node scripts/check-snippets.js

      - name: Trigger expansion check
        run: node scripts/check-expansion.js

      - name: Language variant + shipped content check
        run: node scripts/check-lang-variants.js

      - name: Snippet grouping check
        run: node scripts/check-snippet-stats.js

      - name: Storage residency check
        run: node scripts/check-storage.js

      - name: Tooltip parity check
        run: node scripts/sync-tooltip.js --check

      - name: Snippet grouping parity check
        run: node scripts/sync-snippet-stats.js --check

      - name: Fill form parity check
        run: node scripts/sync-fill-form.js --check

      - name: Check shared fill-form UI copy
        run: node scripts/sync-fill-form-ui.js --check

      - name: Fill form view model check
        run: node scripts/check-fill-form.js

      - name: Unfinished-text check
        run: node scripts/check-unfinished.js

      - name: Unused-asset rule parity check
        run: node scripts/check-inactivity-parity.js

      - name: Working memory parity check
        run: node scripts/check-memory-parity.js

      - name: Phone memory pack parity check
        run: node scripts/sync-memory-pack.js --check

      - name: Phone memory chunk parity check
        run: node scripts/sync-memory-chunk.js --check

      - name: Memory chunk + chat capture check
        run: node scripts/check-memory-chunk.js

      - name: Interactive Steps parity check
        run: node scripts/check-interactive-steps.js

      - name: Brain inside a prompt check
        run: node scripts/check-prompt-brain.js

      - name: Santo del Giorno + Christmas countdown parity check
        run: node scripts/check-saint-of-day.js

      - name: Ask Fibonax parity check
        run: node scripts/check-ask-knowledge.js

      - name: Review status parity check
        run: node scripts/check-review-status.js

      - name: Draft with AI parity check
        run: node scripts/check-ai-draft.js

      - name: Pro lock check
        run: node scripts/check-pro-gate.js

      - name: Landing translation parity check
        run: node scripts/build-landing-i18n.js --check

      - name: Pricing page numbers match PRICING
        run: node scripts/check-pricing-config.js

      - name: Landing FAQ structured data
        run: node scripts/check-landing-faq.js

      - name: Industry-neutral wording check
        run: node scripts/check-industry-neutral.js

      - name: User docs house rules
        run: node scripts/check-docs.js

      # The same checks Mintlify runs before it publishes docs.fibonax.com.
      # A failed publish keeps the old site live without telling anyone, so it
      # has to fail here instead. Pinned so a CLI release cannot change the verdict.
      - name: User docs build and links
        working-directory: user-docs
        run: |
          npx --yes mint@4.2.940 validate
          npx --yes mint@4.2.940 broken-links

      - name: File structure check
        run: |
          test -f extension/manifest.json
          test -f app/index.html
          test -f app/package.json
          test -f user-docs/docs.json

      - name: CI Passed
        run: echo "Fibonax CI OK"

  # The dashboard's own gates: the same four commands every commit to app/ must
  # pass by hand (root CLAUDE.md, Verification Protocol). Until 2026-10-26 they
  # ran nowhere automatically, so the test suite only caught what someone
  # remembered to run.
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build