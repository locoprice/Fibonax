{

    "https://unpkg.com/three@0.184.0/build/three.module.min.js": "sha384-35WaVqXNGvw49+RCXk67Ci9ebo55/5+CfirDbAVSG21KV8/7gO4xwIkhA5ZRcUHc",
    "https://unpkg.com/three@0.184.0/build/three.core.min.js": "sha384-/2vXInuUL2LKgd3n86c5RIzG+YC7vk3zYPTknaEkF2H2sauHtaOrS8swZ+MURxU6"

<script type="module">
// The 3D T mark from the LeibTour T animation handoff (version B). Geometry,
// material, lights and motion are the handoff's final values: see
// scripts/templates/pricing-artwork.md before changing any number here.
const figure = document.querySelector('.pricing-artwork');
const canvas = figure.querySelector('canvas');

// Geometry traced from the ver.2 reference render. Pixel coords from the
// 2560-wide reference, normalised: x'=(x-1270)/600, y'=(700-y)/600.
const px = (pts) => pts.map(([x, y]) => [(x - 1270) / 600, (700 - y) / 600]);
const mirror = (pts) => pts.map(([x, y]) => [-x, y]);

// Outer wing + centre stem: one symmetric piece ending in the V tip.
const OUTER = px([
  [640, 110], [1120, 110], [1270, 260], [1420, 110], [1900, 110],
  [1850, 165], [1470, 165], [1325, 310], [1325, 1140], [1270, 1200],
  [1215, 1140], [1215, 310], [1070, 165], [690, 165],
]);
// Middle wing + middle stem (left piece; right is mirrored).
const MID_L = px([
  [720, 190], [1070, 190], [1190, 310], [1190, 1110], [1130, 1050],
  [1130, 370], [1005, 245], [775, 245],
]);
// Inner wing + outer stem.
const INNER_L = px([
  [800, 270], [1020, 270], [1105, 355], [1105, 1050], [1045, 990],
  [1045, 410], [960, 325], [855, 325],
]);

function buildT(THREE, material, { depth = 0.16, bevel = 0.012 } = {}) {
  const group = new THREE.Group();
  group.name = 'leibtour_T';
  const mk = (name, pts) => {
    const shape = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 2,
    });
    geo.translate(0, 0, -depth / 2);
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, material);
    m.name = name;
    m.castShadow = m.receiveShadow = true;
    group.add(m);
  };
  mk('wing_outer_stem_center', OUTER);
  mk('stripe_mid_left', MID_L);
  mk('stripe_mid_right', mirror(MID_L).reverse());
  mk('stripe_inner_left', INNER_L);
  mk('stripe_inner_right', mirror(INNER_L).reverse());
  return group;
}

// Studio-style equirect environment drawn on a canvas: gives chrome something to reflect.
function makeStudioEnv(THREE, renderer) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.42, '#c9cad0');
  grad.addColorStop(0.5, '#6a6b72'); grad.addColorStop(0.56, '#1a1a1e'); grad.addColorStop(1, '#050506');
  g.fillStyle = grad; g.fillRect(0, 0, 1024, 512);
  // soft light panels
  const panel = (x, y, w, h, a) => { g.fillStyle = `rgba(255,255,255,${a})`; g.fillRect(x, y, w, h); };
  panel(60, 40, 300, 150, 1); panel(640, 30, 340, 120, 0.95); panel(380, 150, 260, 40, 0.8); panel(200, 330, 620, 24, 0.55);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pm = new THREE.PMREMGenerator(renderer);
  const env = pm.fromEquirectangular(tex).texture;
  tex.dispose(); pm.dispose();
  return env;
}

function start(THREE) {
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  // Only three's own shaders run here, fixed by the pinned version. Skipping the
  // check keeps driver notes (Windows prints several) out of the console.
  renderer.debug.checkShaderErrors = false;
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  scene.environment = makeStudioEnv(THREE, renderer);
  const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 50);
  camera.position.set(0, 0.15, 6.2);

  const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3, 4, 5);
  const rim = new THREE.DirectionalLight(0xdfe6ff, 0.8); rim.position.set(-4, -2, -3);
  const sweep = new THREE.PointLight(0xffffff, 0, 6, 2);
  scene.add(key, rim, sweep);

  const chrome = new THREE.MeshStandardMaterial({ color: 0x8a8b92, metalness: 1, roughness: 0.16 });
  chrome.name = 'dark_chrome';
  const model = buildT(THREE, chrome);
  model.position.sub(new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3()));
  const pivot = new THREE.Group(); // pendulum sway
  const tilt = new THREE.Group();  // follows the pointer
  pivot.add(model); tilt.add(pivot); scene.add(tilt);
  // Stripes float as separated layers: each keeps its rest position and a depth order, centre nearest.
  const layers = model.children.map((m, i) => ({ m, rest: m.position.clone(), depth: [0, 0.5, 0.5, 1, 1][i], side: [0, -1, 1, -1, 1][i] }));

  const PERIOD = 10; // seconds per seamless loop
  const target = { x: 0, y: 0 }, cur = { x: 0, y: 0 };
  let ph = 0;

  function pose() {
    pivot.rotation.y = Math.sin(ph * Math.PI * 2) * 0.5;
    pivot.rotation.x = Math.sin(ph * Math.PI * 4 + 1) * 0.06;
    const open = 0.5 - 0.5 * Math.cos(ph * Math.PI * 2);
    const s = (ph * 2) % 1;
    sweep.position.set(-3 + 6 * s, 1.2 - 2 * s, 1.6);
    sweep.intensity = 6 * Math.sin(s * Math.PI);
    cur.x += (target.x - cur.x) * 0.06; cur.y += (target.y - cur.y) * 0.06;
    tilt.rotation.x = cur.x; tilt.rotation.y = cur.y * 0.6;
    // layers breathe apart and close again; deeper layers also shift more with the pointer
    for (const L of layers) {
      L.m.position.x = L.rest.x + L.side * L.depth * 0.08 * open + cur.y * L.depth * 0.12;
      L.m.position.y = L.rest.y - L.depth * 0.05 * open - cur.x * L.depth * 0.12;
      L.m.position.z = L.rest.z - L.depth * 0.42 * open;
    }
  }

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    // keep the mark fully in frame on narrow containers
    camera.position.z = 6.2 * Math.max(1, 1.15 / camera.aspect);
    renderer.render(scene, camera);
  }

  // The loop runs only while the mark is on screen and motion is welcome.
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  let raf = 0, last = 0, onScreen = false;
  function frame(now) {
    // a long gap (background tab) resumes where it paused instead of jumping
    if (last) ph = (ph + Math.min(now - last, 100) / 1000 / PERIOD) % 1;
    last = now;
    pose();
    renderer.render(scene, camera);
    raf = requestAnimationFrame(frame);
  }
  function play() {
    const run = onScreen && !still.matches;
    if (run && !raf) { last = 0; raf = requestAnimationFrame(frame); }
    if (!run && raf) { cancelAnimationFrame(raf); raf = 0; }
  }
  // Reduced motion: one still frame at phase 0, no loop and no tilt.
  function rest() {
    ph = 0; target.x = target.y = cur.x = cur.y = 0;
    pose();
    renderer.render(scene, camera);
  }

  const aim = (nx, ny) => { target.y = nx * 0.45; target.x = ny * 0.3; };
  addEventListener('pointermove', (e) => aim((e.clientX / innerWidth - 0.5) * 2, (e.clientY / innerHeight - 0.5) * 2));
  // the pointer left the window, or a touch ended: ease back to rest
  document.addEventListener('pointerout', (e) => { if (!e.relatedTarget) aim(0, 0); });

  pose();
  new ResizeObserver(resize).observe(canvas);
  new IntersectionObserver(([entry]) => { onScreen = entry.isIntersecting; play(); }).observe(canvas);
  still.addEventListener('change', () => { if (still.matches) rest(); play(); });
  figure.classList.add('is-ready');
}

try {
  start(await import('three'));
} catch (err) {
  console.error('Pricing page: the 3D T mark could not start (three.js did not load or WebGL is off), so the page shows without it.', err);
  figure.remove();
}
</script>
